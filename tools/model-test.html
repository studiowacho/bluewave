<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const names = ['dolphin','shark','whale','seal','fish','gull','pelican'];
const view = new URLSearchParams(location.search).get('view') || 'side';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1400, 800); document.body.append(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa4ad);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
const cam = new THREE.OrthographicCamera(-4.2, 4.2, 2.4, -2.4, 0.1, 100);
if (view === 'side') { cam.position.set(-20, 6, -8); } else { cam.position.set(0, 20, 0); cam.up.set(1,0,0); }
cam.lookAt(0, 0, 0);
const loader = new GLTFLoader(); let done = 0;
names.forEach((n, i) => loader.load(`/models/${n}.glb`, (g) => {
  const o = g.scene; o.position.set(0, i < 4 ? 1.2 : -1.2, (i % 4) * 2.1 - 3.1);
  if (view === 'top') o.position.set(i < 4 ? -1.2 : 1.2, 0, (i % 4) * 2.1 - 3.1);
  o.traverse(m => { if (m.isMesh) { m.material.side = THREE.DoubleSide; m.geometry.computeVertexNormals(); m.material.metalness = 0; m.material.roughness = 0.5; } });
  scene.add(o);
  // red marker at +z end
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
  s.position.copy(o.position).add(new THREE.Vector3(0, 0, 0.6)); scene.add(s);
  if (++done === names.length) { r.render(scene, cam); document.title = 'ready'; }
}));
</script>
