<meta charset="utf-8">
<title>Bluewave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap">
<style>
/* Layout: full-bleed WebGL water column; spec sheet floats top-left, instrument panel docks right (bottom sheet on phones). */
:root {
  --bg: #0a0d0f;
  --ink: #e2e8e5;
  --mute: #86938e;
  --faint: #55615d;
  --line: rgba(205, 224, 217, 0.11);
  --panel: rgba(11, 15, 17, 0.8);
  --accent: #9fdccf;
  --accent-ink: #072520;
  --f-display: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: var(--f-ui); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.spec {
  position: fixed; pointer-events: none; width: 280px;
  top: calc(env(safe-area-inset-top, 0px) + 22px);
  left: calc(env(safe-area-inset-left, 0px) + 24px);
  display: grid; gap: 14px;
}
body::after {
  content: ""; position: fixed; top: 0; left: 0; width: min(640px, 100vw); height: 460px; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 100% at 0% 0%, rgba(6, 10, 12, 0.62), rgba(6, 10, 12, 0.28) 45%, rgba(6, 10, 12, 0) 75%);
  opacity: var(--scrim, 0); transition: opacity .4s;
}
.spec, .hints { z-index: 1; }
body.open-water { --scrim: 1; }
.spec .eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.spec h1 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 40px; line-height: .95; letter-spacing: -0.01em; text-wrap: balance; }
.spec h1 span { color: var(--accent); }
.spec dl { margin: 0; display: grid; grid-template-columns: 78px 1fr; row-gap: 3px; font-family: var(--f-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.spec dt { color: var(--faint); }
.spec dd { margin: 0; color: var(--ink); white-space: nowrap; }
.spec dd.state { color: var(--accent); }
.spec hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; grid-column: 1 / -1; }

.hints {
  position: fixed; pointer-events: none;
  left: calc(env(safe-area-inset-left, 0px) + 24px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  font-family: var(--f-mono); font-size: 10.5px; color: var(--mute); letter-spacing: .02em;
  max-width: calc(100vw - 380px);
}
.hints b { color: var(--ink); font-weight: 500; }

.paused-tag { margin-left: 10px; color: var(--accent); }

.panel {
  position: fixed; width: 304px; overflow-y: auto; overscroll-behavior: contain;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
}
.panel-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 19px; }
.panel-head .fps { font-family: var(--f-mono); font-size: 10.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
.grp { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.grp:last-child { border-bottom: 0; }
.grp h3 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.grp p.note { margin: -4px 0 0; color: var(--faint); font-size: 12px; line-height: 1.35; }

.row { display: grid; grid-template-columns: 1fr auto; row-gap: 3px; align-items: baseline; }
.row label { color: var(--ink); font-size: 13px; }
.row output { font-family: var(--f-mono); font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--bg); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--bg); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { font: 500 12px var(--f-ui); color: var(--mute); background: transparent; border: 0; border-left: 1px solid var(--line); padding: 7px 4px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-label { display: flex; justify-content: space-between; font-size: 13px; }
.seg-label span:last-child { font-family: var(--f-mono); font-size: 11px; color: var(--mute); }

.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { font: 500 12.5px var(--f-ui); color: var(--ink); background: rgba(205,224,217,.05); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn kbd { font: 10px var(--f-mono); color: var(--mute); }
.btn:hover { border-color: rgba(205,224,217,.28); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); grid-column: 1 / -1; }
.btn.primary kbd { color: var(--accent-ink); opacity: .7; }
.btn:focus-visible, .seg button:focus-visible, .toggle:focus-visible, .sheet-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.swatch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; cursor: pointer; }
.swatch input { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
.swatch input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 3px; }
.swatch span { font-size: 12.5px; }
.swatch small { margin-left: auto; font: 10px var(--f-mono); color: var(--mute); text-transform: uppercase; }

.toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; font: 13px var(--f-ui); color: var(--ink); background: transparent; border: 0; padding: 2px 0; cursor: pointer; }
.toggle i { width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--mute); transition: transform .2s, background .2s; }
.toggle[aria-pressed="true"] i { background: var(--accent); }
.toggle[aria-pressed="true"] i::after { transform: translateX(12px); background: var(--accent-ink); }

.sheet-toggle { display: none; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.fallback h2 { font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 32px; margin: 0 0 8px; }
.fallback p { color: var(--mute); max-width: 40ch; margin: 0 auto; }

@media (max-width: 1000px) { .spec dl .wide { display: none; } }
@media (max-width: 760px) {
  .spec { width: auto; right: 16px; gap: 8px; }
  .spec h1 { font-size: 30px; }
  .spec dl { grid-template-columns: 64px 1fr; font-size: 10.5px; }
  .spec dl .optional { display: none; }
  .hints { display: none; }
  .panel { top: auto; left: calc(env(safe-area-inset-left, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 56vh; }
  .panel.collapsed { display: none; }
  .sheet-toggle { display: block; position: fixed; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font: 500 13px var(--f-ui); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 4px; padding: 9px 14px; z-index: 2; }
  .panel:not(.collapsed) + .sheet-toggle { bottom: calc(56vh + env(safe-area-inset-bottom, 0px) + 16px); }
}
@media (prefers-reduced-motion: reduce) { .toggle i, .toggle i::after { transition: none; } }
</style>

<div id="stage"></div>

<header class="spec" aria-label="Sea state readout">
  <div class="eyebrow">Study 01 · water column</div>
  <h1>Blue<span>wave</span></h1>
  <dl>
    <dt>State</dt><dd class="state" id="r-state">—</dd>
    <dt>H<sub>s</sub></dt><dd id="r-hs">—</dd>
    <dt>T<sub>p</sub></dt><dd id="r-tp">—</dd>
    <dt>λ<sub>p</sub></dt><dd id="r-lp">—</dd>
    <dt>Steepness</dt><dd id="r-st">—</dd>
    <dt>Wind</dt><dd id="r-wind">—</dd>
    <hr class="optional">
    <dt class="optional">Time</dt><dd class="optional" id="r-time">T+00:00</dd>
    <dt class="optional">Light</dt><dd class="optional" id="r-light">—</dd>
    <dt class="optional wide">Grid</dt><dd class="optional wide" id="r-grid">—</dd>
    <dt class="optional wide">Spectrum</dt><dd class="optional wide" id="r-spec">—</dd>
    <dt class="optional wide">Seed</dt><dd class="optional wide" id="r-seed">1</dd>
    <dt class="optional wide">Engine</dt><dd class="optional wide" id="r-engine">WebGL2 · three</dd>
  </dl>
</header>

<div class="hints"><b>drag</b> orbit · <b>scroll</b> zoom · <b>double-click</b> reset · <b>space</b> pause · <b>r</b> new sea · <b>w</b> rogue wave<span class="paused-tag" id="paused-tag" hidden>paused</span></div>

<aside class="panel" id="panel" aria-label="Sea controls">
  <div class="panel-head"><h2>Instrument</h2><span class="fps" id="r-fps">— fps</span></div>
  <div id="controls"></div>
</aside>
<button class="sheet-toggle" id="sheet-toggle" type="button" aria-controls="panel">Controls</button>

<script type="module" src="./src/main.js"></script>
