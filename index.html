<style>
@font-face {
  font-family: 'Fraunces';
  src: url('./fonts/fraunces.woff2') format('woff2-variations'), url('./fonts/fraunces.woff2') format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
/* Layout: full-bleed ocean. Title top-left, one floating toolbar bottom-centre whose buttons open a short popover above it. Credit is a footnote bottom-left. */
:root {
  --bg: #07090c;
  --ink: #f5f5f7;
  --ink-2: rgba(235, 235, 245, 0.62);
  --ink-3: rgba(235, 235, 245, 0.32);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-2: rgba(118, 118, 128, 0.14);
  --sep: rgba(255, 255, 255, 0.1);
  --glass: rgba(24, 28, 34, 0.18);
  --accent: #0a84ff;
  --font: 'SF Pro Text', 'SF Pro Icons', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-display: 'SF Pro Display', 'SF Pro Icons', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --headline: 'Fraunces', ui-serif, Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -0.022em; font-weight: 400;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  font-feature-settings: 'cv11', 'ss01', 'ss03';
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
button { font-family: inherit; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.glass {
  position: relative; isolation: isolate;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03) 38%, rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, 0.07)),
    var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.9) brightness(1.06);
  backdrop-filter: blur(14px) saturate(1.9) brightness(1.06);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.32),
    inset 0 -1px 1px rgba(255, 255, 255, 0.08),
    inset 0 0 22px rgba(255, 255, 255, 0.05),
    0 10px 36px rgba(0, 0, 0, 0.28),
    0 2px 6px rgba(0, 0, 0, 0.16);
}
/* refraction at the edge, where the browser supports SVG backdrop filters (Chromium) */
.lensing .glass {
  -webkit-backdrop-filter: url(#liquid-lens) blur(12px) saturate(1.9) brightness(1.06);
  backdrop-filter: url(#liquid-lens) blur(12px) saturate(1.9) brightness(1.06);
}
/* specular rim: a light-catching hairline brighter at the top-left and bottom-right */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: -1;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.08) 30%, rgba(255, 255, 255, 0.02) 60%, rgba(255, 255, 255, 0.32));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

body::after {
  content: ""; position: fixed; inset: 0 auto auto 0; width: min(560px, 100vw); height: 260px; pointer-events: none; z-index: 0;
  background: radial-gradient(110% 100% at 0 0, rgba(5, 8, 12, 0.5), rgba(5, 8, 12, 0) 70%);
  opacity: var(--scrim, 0); transition: opacity .4s;
}
body.open-water { --scrim: 1; }

.title {
  position: fixed; z-index: 1; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 28px);
  left: calc(env(safe-area-inset-left, 0px) + 32px);
}
.title h1 { margin: 0; font-family: var(--headline); font-size: 48px; font-weight: 400; line-height: 1.04; letter-spacing: -0.02em; font-variation-settings: 'opsz' 96, 'SOFT' 40; }
.title p { margin: 8px 0 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.022em; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* toolbar + popover */
.dock {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: grid; justify-items: center; gap: 12px;
  width: max-content; max-width: calc(100vw - 24px);
}
.toolbar { display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; }
.toolbar .sep { width: 0.5px; height: 22px; background: var(--sep); margin: 0 6px; }
.view { display: grid; grid-auto-flow: column; padding: 2px; border-radius: 999px; background: var(--fill-2); }
.view button { border: 0; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600; letter-spacing: -0.016em; padding: 8px 15px; border-radius: 999px; cursor: pointer; transition: color .15s, background .2s; }
.view button[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25), 0 1px 4px rgba(0, 0, 0, 0.25); }
.tool { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; letter-spacing: -0.016em; padding: 8px 14px 8px 11px; border-radius: 999px; cursor: pointer; transition: background .15s; }
.tool svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--fill-2); }
.tool[aria-expanded="true"] { background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25); }

.popover {
  width: 360px; max-width: calc(100vw - 24px); max-height: min(560px, calc(100dvh - 170px));
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  border-radius: 26px; padding: 18px; scrollbar-width: none;
  interpolate-size: allow-keywords;
  transform-origin: 50% 100%;
  transition: opacity .22s ease, transform .32s cubic-bezier(.2, .9, .25, 1.1), visibility 0s linear 0s, height .3s ease;
}
.popover:not(.open) { opacity: 0; transform: translateY(14px) scale(.97); visibility: hidden; pointer-events: none; transition: opacity .16s ease, transform .2s ease, visibility 0s linear .2s; }
.grabber { display: none; }
button, a, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.popover::-webkit-scrollbar { display: none; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.pop-head h2 { margin: 0; font-family: var(--headline); font-size: 28px; font-weight: 400; line-height: 1.1; letter-spacing: -0.015em; font-variation-settings: 'opsz' 48, 'SOFT' 40; }
.close { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.close svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.panel { display: grid; gap: 18px; }

.row { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; align-items: baseline; }
.row label { font-size: 17px; letter-spacing: -0.022em; }
.row output { font-size: 17px; letter-spacing: -0.022em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; --p: 50%; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), var(--fill) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--fill); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 7px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(0, 0, 0, 0.06); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 7px rgba(0, 0, 0, 0.3); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.5), 0 2px 7px rgba(0, 0, 0, 0.3); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 10px; background: var(--fill-2); }
.seg button { border: 0; background: transparent; color: var(--ink); font-size: 14px; letter-spacing: -0.016em; font-weight: 500; padding: 7px 4px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.18); font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25), inset 0 0.5px 0 rgba(255, 255, 255, 0.2); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { border: 0; border-radius: 999px; padding: 12px 16px; font-size: 17px; letter-spacing: -0.022em; font-weight: 500; cursor: pointer; background: var(--fill); color: var(--ink); transition: filter .15s; }
.btn:hover { filter: brightness(1.15); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.small { font-size: 14px; letter-spacing: -0.016em; padding: 10px 6px; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip { overflow: hidden; display: grid; justify-items: center; align-content: center; gap: 6px; padding: 10px 4px 9px; border: 0; border-radius: 16px; background: var(--fill-2); color: var(--ink-3); cursor: pointer; font-size: 12px; letter-spacing: -0.01em; font-weight: 500; transition: background .2s, color .2s; }
.chip img { width: 84%; height: 40px; object-fit: contain; image-rendering: auto; filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.4)) grayscale(1) brightness(0.8); opacity: 0.45; transition: filter .25s, opacity .25s, transform .3s cubic-bezier(.2, .9, .25, 1.2); user-select: none; -webkit-user-drag: none; }
.chip[aria-pressed="true"] { background: rgba(10, 132, 255, 0.2); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(100, 181, 255, 0.35); }
.chip[aria-pressed="true"] img { filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45)); opacity: 1; transform: scale(1.04); }
.chip:active img { transform: scale(0.94); }

.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { display: grid; justify-items: center; gap: 7px; border: 0; background: none; color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; padding: 0; }
.swatch i { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.25); transition: box-shadow .15s; }
.swatch[aria-pressed="true"] { color: var(--ink); }
.swatch[aria-pressed="true"] i { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4.5px var(--accent); }

.toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; color: var(--ink); font-size: 17px; letter-spacing: -0.022em; padding: 0; cursor: pointer; }
.toggle i { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); transition: transform .25s cubic-bezier(.3, 1.3, .5, 1); }
.toggle[aria-pressed="true"] i { background: #30d158; }
.toggle[aria-pressed="true"] i::after { transform: translateX(20px); }

.tool:focus-visible, .view button:focus-visible, .seg button:focus-visible, .btn:focus-visible, .chip:focus-visible, .swatch:focus-visible, .toggle:focus-visible, .close:focus-visible, .credit a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.credit {
  position: fixed; z-index: 2; display: flex; align-items: center; gap: 10px;
  left: calc(env(safe-area-inset-left, 0px) + 24px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
  font-size: 12px; letter-spacing: -0.01em; color: var(--ink-3);
}
.credit > a { text-decoration: none; color: var(--ink-2); }
.credit > a:hover { color: var(--ink); }
.credit nav { display: flex; gap: 2px; }
.credit nav a { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--ink-3); }
.credit nav a:hover { color: var(--ink); background: var(--fill-2); }
.credit svg { width: 13px; height: 13px; fill: currentColor; }

.fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.fallback h2 { font-size: 28px; margin: 0 0 8px; }
.fallback p { color: var(--ink-2); max-width: 40ch; margin: 0 auto; }

@media (max-width: 900px) {
  .credit { top: calc(env(safe-area-inset-top, 0px) + 136px); bottom: auto; left: calc(env(safe-area-inset-left, 0px) + 32px); }
}
@media (max-width: 560px) {
  .title { top: calc(env(safe-area-inset-top, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 20px); right: 20px; }
  .title h1 { font-size: 34px; }
  .title p { font-size: 15px; margin-top: 4px; }
  .credit { top: calc(env(safe-area-inset-top, 0px) + 98px); left: calc(env(safe-area-inset-left, 0px) + 20px); transition: opacity .2s; }
  .credit nav a { width: 32px; height: 32px; }
  .credit svg { width: 15px; height: 15px; }
  body.sheet-open .credit { opacity: 0; pointer-events: none; }

  /* bottom bar: full width, iOS tab-bar style buttons with labels under icons */
  .dock {
    left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
    transform: none; width: auto; max-width: none;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 10px; justify-items: stretch;
  }
  .toolbar { border-radius: 30px; padding: 6px; gap: 2px; justify-content: space-between; }
  .toolbar .sep { margin: 0 2px; height: 32px; }
  .view { flex: 0 0 auto; }
  .view button { padding: 0 12px; min-height: 44px; font-size: 14px; }
  .tool { flex: 1 1 0; min-width: 0; min-height: 52px; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 4px; border-radius: 22px; }
  .tool span { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
  .tool[aria-expanded="true"] span { color: var(--ink); }
  .tool svg { width: 22px; height: 22px; }

  /* sheet: grows to its content, scrolls inside when tall, swipe or tap the ocean to close */
  .popover {
    width: 100%; max-width: none; border-radius: 28px; padding: 8px 18px 20px;
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 150px);
  }
  .grabber { display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 2px auto 8px; }
  .pop-head { position: sticky; top: -8px; z-index: 1; margin: 0 -18px 12px; padding: 4px 18px 6px; }
  .pop-head h2 { font-size: 26px; }
  .close { width: 36px; height: 36px; }
  .panel { gap: 20px; }
  input[type=range] { height: 40px; }
  input[type=range]::-webkit-slider-thumb { width: 28px; height: 28px; margin-top: -12px; }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; }
  .seg button { min-height: 40px; font-size: 15px; }
  .btn { min-height: 50px; }
  .btn.small { min-height: 44px; font-size: 15px; }
  .chips { gap: 8px; }
  .chip { min-height: 78px; padding: 10px 2px 9px; font-size: 12px; }
  .chip img { height: 36px; width: 82%; }
  .swatch i { width: 48px; height: 48px; }
  .toggle { min-height: 44px; }
}
@media (max-width: 560px) and (max-height: 640px), (max-height: 480px) {
  .title h1 { font-size: 26px; }
  .title p { font-size: 13px; }
  .credit { display: none; }
  .popover { max-height: calc(100dvh - 120px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>

  </filter>
</svg>

</script>
